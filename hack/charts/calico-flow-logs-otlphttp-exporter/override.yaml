env:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.opentelemetry-collector:4318"

volumes:
  - name: goldmane-certs
    secret:
      secretName: goldmane-key-pair
      optional: false
  - name: goldmane-ca-cert
    configMap:
      name: goldmane-ca-bundle
      items:
        - key: "tigera-ca-bundle.crt"
          path: "tigera-ca-bundle.crt"

volumeMounts:
  - name: goldmane-certs
    mountPath: /etc/goldmane/certs
    readOnly: true
  - name: goldmane-ca-cert
    mountPath: /etc/goldmane/ca-cert
    readOnly: true
