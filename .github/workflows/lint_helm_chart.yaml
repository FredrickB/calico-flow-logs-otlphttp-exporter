name: Lint Helm chart

on:
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/**'
      - 'charts/**'

env:
  CHARTS_DIR: charts/calico-flow-logs-otlphttp-exporter

jobs:
  lint-chart:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Helm chart
        working-directory: ${{ env.CHARTS_DIR }}
        run: helm lint .
