name: Lint Helm chart

on:
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/**'
      - 'charts/**'

env:
  CHARTS_DIR: charts

jobs:
  lint-chart:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Helm chart
        run: helm lint $CHARTS_DIR/**
